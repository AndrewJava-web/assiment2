<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nile-Mart - Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

<!-- القائمة العلوية المشتركة -->
<nav>
    <a href="/products">Products</a> |
    <a href="/categories">Categories</a> |
    <a href="/brands">Brands</a>
</nav>

<h1>Available Products</h1>

<table>
    <thead>
    <tr>
        <th>SKU</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Category</th>
        <th>Brand</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="product : ${availableProducts}">
        <td th:text="${product.sku}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.price}"></td>
        <td th:text="${product.inStock}"></td>
        <td th:text="${categoryNames[product.category]}"></td>
        <td th:text="${product.brandSlug != null and brandNames[product.brandSlug] != null} ? ${brandNames[product.brandSlug]} : '—'"></td>
    </tr>
    </tbody>
</table>

</body>
<html>
