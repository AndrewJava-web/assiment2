<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Brand</title>
</head>
<body>
<nav>
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/categories}">Categories</a>
    <a th:href="@{/brands}">Brands</a>
</nav>

<h1>New Brand</h1>

<form th:action="@{/brands}" th:object="${brand}" method="post">
    <div>
        <label>Name</label>
        <input type="text" th:field="*{name}">
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></span>
    </div>

    <div>
        <label>Slug</label>
        <input type="text" th:field="*{slug}">
        <span th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}" style="color:red"></span>
    </div>

    <div>
        <label>
            <input type="checkbox" th:field="*{active}"> Active
        </label>
    </div>

    <button type="submit">Save</button>
    <a th:href="@{/brands}">Cancel</a>
</form>
</body>
</html>
