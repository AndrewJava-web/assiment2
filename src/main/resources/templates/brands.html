<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Brands</title>
</head>
<body>
<nav>
    <a th:href="@{/products}">Products</a> |
    <a th:href="@{/categories}">Categories</a> |
    <a th:href="@{/brands}">Brands</a>
</nav>

<h1>Brands</h1>
<a th:href="@{/brands/new}">Add Brand</a>

<table border="1">
    <thead>
    <tr><th>Name</th><th>Slug</th><th>Active</th></tr>
    </thead>
    <tbody>
    <tr th:each="b : ${brands}">
        <td th:text="${b.name}"></td>
        <td th:text="${b.slug}"></td>
        <td th:text="${b.active} ? 'Yes' : 'No'"></td>
    </tr>
    </tbody>
</table>
</body>

</html>
